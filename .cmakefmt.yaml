format:
  # Lowercasing commands would rewrite FetchContent_Declare as
  # fetchcontent_declare. Valid CMake, since commands are case-insensitive, but
  # it does not match how the upstream docs spell them.
  command_case: unchanged

# One source per line for the commands that list source files. Scoped, because
# setting this globally would also explode set() and FetchContent_Declare().
per_command_overrides:
  target_sources:
    max_hanging_wrap_positional_args: 1
  add_executable:
    max_hanging_wrap_positional_args: 1
  add_library:
    max_hanging_wrap_positional_args: 1
