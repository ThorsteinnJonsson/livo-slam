/**:
  ros__parameters:
    ros.imu_topic: /alphasense_driver_ros/imu
    ros.lidar_topic: /hesai/pandar
    ros.camera_topic: /alphasense_driver_ros/cam0/debayered/image/compressed
    ros.camera_compressed: true

    ros.output_trajectory: true
    ros.trajectory_path: /workspace/evaluation/trajectory.tum

    # Pipeline config
    imu_init.window_size: 200
    imu_init.gravity_magnitude: 9.81
    imu_init.max_accel_var: 0.05
    imu_init.max_gyro_var: 0.01
    initial_state.rotation_std: 0.017
    initial_state.position_std: 0.001
    initial_state.velocity_std: 0.01
    initial_state.gyro_bias_std: 0.001
    initial_state.accel_bias_std: 0.01
    initial_state.gravity_std: 0.01
    initial_state.inv_exposure_std: 0.1

    process_noise.gyro_noise_std: 0.3162
    process_noise.accel_noise_std: 0.3162
    process_noise.gyro_random_walk_std: 0.01
    process_noise.accel_random_walk_std: 0.01
    process_noise.inv_exposure_random_walk_std: 0.1

    # Derived from calibration/cam-lidar-imu.yaml, which gives T_cam_imu and
    # T_cam_lidar for cam0. T_body_lidar = T_imu_cam * T_cam_lidar.
    # prettier-ignore
    lidar.T_body_lidar: [
      -0.01663805, -0.99986011,  0.00171598, -0.00065171,
       0.99985526, -0.01663181,  0.00358431, -0.01551034,
      -0.00355527,  0.00177537,  0.99999210,  0.08463266,
       0.00000000,  0.00000000,  0.00000000,  1.00000000]

    # prettier-ignore
    camera.T_body_cam: [
      -0.99996258, -0.00531093,  0.00682875, -0.00035616,
      -0.00685019,  0.00402822, -0.99996842, -0.06901176,
       0.00528325, -0.99997778, -0.00406445,  0.00483975,
       0.00000000,  0.00000000,  0.00000000,  1.00000000]

    camera.width: 1440
    camera.height: 1080
    camera.fx: 698.1692094914263
    camera.fy: 698.5147584873237
    camera.cx: 712.7646767255006
    camera.cy: 560.5751284820508

    # cam0 is equidistant (Kannala-Brandt), coefficients from
    # calibration/cam0.yaml in the dataset.
    camera.distortion_model: equidistant
    camera.equidistant.k1: -0.04114225009462773
    camera.equidistant.k2: -0.002421765984053725
    camera.equidistant.k3: 0.003400355152679783
    camera.equidistant.k4: -0.0018518822347983275

    # Cameras and IMU are FPGA-synchronised in the Alphasense unit.
    # t_imu = t_cam + time_shift
    camera.time_shift: 0.0

    viz.enabled: true
    viz.grpc_url: rerun+http://127.0.0.1:9877/proxy

    lidar.min_range: 1.0
    lidar.max_range: 60.0
    lidar.voxel_leaf_size: 0.1

    # The Hesai header is stamped at the start of the scan and its per-point
    # timestamps are absolute, so no scan-period correction is needed.
    # t_imu = t_lidar_header + time_shift
    lidar.time_shift: 0.0

    map.voxel_size: 0.5
    map.layer_init_points: [5, 5, 5]
    map.max_points_per_voxel: 50
    map.max_plane_variance: 0.01
    map.max_match_distance: 0.5

    visual_map.grid_size: 30
    visual_map.min_corner_score: 0.0
    visual_map.min_seconds_between_patches: 2.0
    visual_map.min_patch_pixel_distance: 40.0

    lidar_update.max_iterations: 5
    lidar_update.point_noise_std: 0.03
    lidar_update.rotation_epsilon: 0.001
    lidar_update.position_epsilon: 0.001

    camera_update.max_iterations: 5
    camera_update.patch_size: 8 # Must be >= 8
    camera_update.intensity_noise_std: 31.6
    camera_update.outlier_threshold: 500.0
    # Raw patch intensities with exposure in the state, not mean-normalised.
    # Normalising cancels brightness, which makes outlier_threshold inert.
    camera_update.normalize_patches: false
    camera_update.estimate_exposure: true
    camera_update.require_normal: true
    camera_update.max_view_angle_deg: 15.0
    camera_update.max_depth_discontinuity: 0.5
    camera_update.selection_grid_size: 30
    camera_update.rotation_epsilon: 0.001
    camera_update.position_epsilon: 0.001
